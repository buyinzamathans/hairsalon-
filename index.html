<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 1080px;
      height: 1350px;
      background: #faf7f4;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 70px;
      color: #231d25;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* New style for your logo image */
    .logo {
      height: 90px;
      object-fit: contain;
      mix-blend-mode: multiply; /* Blends any white background into the poster */
    }

    .tagline {
      font-size: 18px;
      font-weight: 600;
      color: #532b82;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .hero-title {
      font-size: 82px;
      font-weight: 900;
      line-height: 1.05;
      margin-top: 20px;
    }

    .hero-title span {
      color: #da1475;
      display: block;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 40px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 480px;
      position: relative;
    }

    /* Styling for the single product image */
    .single-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid #f0f0f0; 
    }

    /* Layout specifically for the collage */
    .collage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 155px 155px;
      gap: 10px;
      height: 320px;
    }

    .collage-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #f0f0f0;
    }

    .badge {
      position: absolute;
      top: 45px;
      left: 45px;
      background: #da1475;
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(218, 20, 117, 0.3);
      z-index: 2;
    }

    .badge.green { background: #249743; box-shadow: 0 4px 12px rgba(36, 151, 67, 0.3); }

    .card-text {
      font-size: 24px;
      font-weight: 800;
      margin-top: 15px;
    }

    .cta-banner {
      background: #532b82;
      color: white;
      border-radius: 30px;
      padding: 40px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 15px 35px rgba(83, 43, 130, 0.25);
    }

    .cta-text h2 { font-size: 38px; font-weight: 900; }
    .cta-text p { font-size: 20px; opacity: 0.85; margin-top: 5px; }

    .cta-phone {
      font-size: 32px;
      font-weight: 900;
      background: white;
      color: #532b82;
      padding: 16px 32px;
      border-radius: 50px;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="logo.png" alt="Fam7 Logo" class="logo">
    <div class="tagline">Nature's Way</div>
  </div>

  <div class="hero-title">
    REAL RESULTS.
    <span>NATURAL CARE.</span>
  </div>

  <div class="main-grid">
    <div class="card">
      <div class="badge">PRODUCTS</div>
      <img class="single-img" src="all products.jpg" alt="Fam7 Products">
      <div class="card-text">Nourish & Restore</div>
    </div>
    
    <div class="card">
      <div class="badge green">SALON</div>
      <div class="collage-grid">
        <img src="hairstyle1.jpg" alt="Hairstyle 1">
        <img src="hairstyle2.jpg" alt="Hairstyle 2">
        <img src="hairstyle5.jpg" alt="Hairstyle 3">
        <img src="hairstyle6.jpg" alt="Hairstyle 4">
      </div>
      <div class="card-text">Custom Styling</div>
    </div>
  </div>

  <div class="cta-banner">
    <div class="cta-text">
      <h2>FIND YOUR FAM7.</h2>
      <p>Visit • Shop • Style</p>
    </div>
    <div class="cta-phone">0774 460 446</div>
  </div>

</body>
</html>
