<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fam7 - Nature's Way</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Mobile Canvas -->
  <div class="canvas-container">
    
    <!-- Header -->
    <header class="header">
      <a href="index.html" class="logo-link">
        <img src="logo.png" alt="Fam7 Logo" class="logo">
      </a>
      <div class="tagline">NATURE'S WAY</div>
    </header>

    <!-- Hero Title & Body -->
    <section class="hero-title">
      <h1><span class="text-backdrop green">REAL RESULTS.</span></h1>
      <h1><span class="text-backdrop pink">NATURAL CARE.</span></h1>
      <p class="hero-subtext">
        <span class="text-backdrop light">
          Premium natural hair & skin products and expert protective styling designed to nourish, protect, and restore your natural beauty.
        </span>
      </p>
      
      <!-- Circular Action Buttons (Call & WhatsApp) -->
      <div class="hero-actions">
        <a href="tel:0789537954" class="circle-action-btn" aria-label="Call Us">
          <svg viewBox="0 0 24 24" class="action-icon" aria-hidden="true">
            <path fill="currentColor" d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
        </a>
        <a href="https://wa.me/256705402729" target="_blank" rel="noopener noreferrer" class="circle-action-btn" aria-label="WhatsApp Us">
          <svg viewBox="0 0 24 24" class="action-icon" aria-hidden="true">
            <path fill="currentColor" d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm0 16.52c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.32a8.19 8.19 0 01-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 012.41 5.83c0 4.54-3.7 8.24-8.22 8.24zm4.52-6.18c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.66.81-.81.98-.15.17-.31.19-.56.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.15-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.71 4.29 3.8.6.26 1.07.41 1.44.53.6.19 1.15.16 1.59.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.07-.1-.23-.17-.48-.29z"/>
          </svg>
        </a>
      </div>
    </section>

    <!-- Side-by-Side Main Cards -->
    <main class="main-grid">
      <!-- Products Card -->
      <div class="card">
        <div class="card-image-area">
          <span class="badge badge-pink">PRODUCTS</span>
          <img class="single-img" src="all products.jpg" alt="Fam7 Products">
        </div>
        <div class="card-text">Nourish & Restore</div>
      </div>
      
      <!-- Salon Card -->
      <div class="card">
        <div class="card-image-area collage-wrapper">
          <span class="badge badge-green">SALON</span>
          <div class="collage-grid">
            <img src="hairstyle1.jpg" alt="Hairstyle 1">
            <img src="hairstyle2.jpg" alt="Hairstyle 2">
            <img src="hairstyle5.jpg" alt="Hairstyle 3">
            <img src="hairstyle6.jpg" alt="Hairstyle 4">
          </div>
        </div>
        <div class="card-text">Custom Styling</div>
      </div>
    </main>

    <!-- Footer / CTA Banner -->
    <footer class="cta-banner">
      <div class="cta-text">
        <h2>FIND YOUR FAM7.</h2>
        <div class="cta-links">
          <a href="#visit" class="sub-link">Visit</a>
          <span class="dot">•</span>
          <a href="#shop" class="sub-link">Shop</a>
          <span class="dot">•</span>
          <a href="#style" class="sub-link">Style</a>
        </div>
      </div>
      <a href="tel:0774460446" class="cta-phone">0774 460 446</a>
    </footer>

  </div>

</body>
</html>
