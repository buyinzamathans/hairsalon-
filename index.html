<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fam7 - Nature's Way</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Mobile Canvas -->
  <div class="canvas-container">
    
    <!-- Header -->
    <header class="header">
      <a href="index.html" class="logo-link">
        <img src="logo.png" alt="Fam7 Logo" class="logo">
      </a>
      <div class="tagline">NATURE'S WAY</div>
    </header>

    <!-- Hero Title & Body -->
    <section class="hero-title">
      <h1><span class="text-backdrop dark">REAL RESULTS.</span></h1>
      <h1><span class="text-backdrop pink">NATURAL CARE.</span></h1>
      <p class="hero-subtext">
        <span class="text-backdrop light">
          Premium natural hair & skin products and expert protective styling designed to nourish, protect, and restore your natural beauty.
        </span>
      </p>
      
      <!-- Circular Phone Call Action Button -->
      <div class="hero-action">
        <a href="tel:0789537954" class="call-circle-btn" aria-label="Call Us">
          <svg viewBox="0 0 24 24" class="phone-icon" aria-hidden="true">
            <path fill="currentColor" d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
        </a>
      </div>
    </section>

    <!-- Side-by-Side Main Cards -->
    <main class="main-grid">
      <!-- Products Card -->
      <div class="card">
        <div class="card-image-area">
          <span class="badge badge-pink">PRODUCTS</span>
          <img class="single-img" src="all products.jpg" alt="Fam7 Products">
        </div>
        <div class="card-text">Nourish & Restore</div>
      </div>
      
      <!-- Salon Card -->
      <div class="card">
        <div class="card-image-area collage-wrapper">
          <span class="badge badge-dark">SALON</span>
          <div class="collage-grid">
            <img src="hairstyle1.jpg" alt="Hairstyle 1">
            <img src="hairstyle2.jpg" alt="Hairstyle 2">
            <img src="hairstyle5.jpg" alt="Hairstyle 3">
            <img src="hairstyle6.jpg" alt="Hairstyle 4">
          </div>
        </div>
        <div class="card-text">Custom Styling</div>
      </div>
    </main>

    <!-- Footer / CTA Banner -->
    <footer class="cta-banner">
      <div class="cta-text">
        <h2>FIND YOUR FAM7.</h2>
        <div class="cta-links">
          <a href="#visit" class="sub-link">Visit</a>
          <span class="dot">•</span>
          <a href="#shop" class="sub-link">Shop</a>
          <span class="dot">•</span>
          <a href="#style" class="sub-link">Style</a>
        </div>
      </div>
      <a href="tel:0774460446" class="cta-phone">0774 460 446</a>
    </footer>

  </div>

</body>
</html>
